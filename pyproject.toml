[project]
name = "rail-rag"
version = "0.1.0"
description = "Question answering over EU railway TSI regulations, with citations and an evaluation gate in CI."
readme = "README.md"
license = "MIT"
authors = [{ name = "João Pedro Cardoso" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "azure-search-documents>=12.0.0",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.143.2",
    "google-genai>=2.31.0",
    "groq>=1.7.0",
    "httpx>=0.28.1",
    "langfuse>=5.0.1",
    "langgraph>=1.2.15",
    "lxml>=6.1.3",
    "pydantic-settings>=2.16.0",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.19.1",
    "sentence-transformers>=6.1.0",
    "torch>=2.14.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
deploy = [
    "huggingface-hub>=1.33.0",
]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
eval = [
    "langchain-community<0.4",
    "ragas>=0.4.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rail_rag"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"eval/build_golden_set.py" = ["E501"]  # data file: long question strings read better unwrapped

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
