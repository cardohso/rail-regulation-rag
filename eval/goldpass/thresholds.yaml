# Thresholds for the retrieval-only gate (16 answerable questions, raw top-8 hits, no LLM).
#
# Retrieval here is deterministic, so a drop is a real change, not sampling noise: there is no
# `baseline.alpha`, and any single question that gets worse fails the baseline check.
#
# Set from what retrieval must do for the pipeline to answer at all (the live eval gate's
# context_recall floor is 0.70, measured after grading), with headroom below today's value.
metrics:
  recall_at_k:  {min: 0.80}   # gold passages are in the top-8 hits
  hit_rate:     {min: 0.85}   # at least one gold passage is in the top-8 hits
  errors:       {max: 0}
tags:
  wrong-document:             # near-identical passages exist in other regulations
    hit_rate:   {min: 0.66}
baseline:
  max_drop: 0.0               # no regression against the committed baseline
