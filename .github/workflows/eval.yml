name: eval

# Runs the 20-question golden set against real (free-tier) LLMs and fails the build if any
# metric drops below eval/thresholds.yaml. Only on pull requests and manual runs, not on every
# push, to stay inside free-tier rate limits.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golden-set:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_ENVIRONMENT: ci
      VECTOR_STORE: qdrant  # the CI index is built locally from the committed corpus
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Check required secrets
        run: |
          missing=""
          [ -n "$GEMINI_API_KEY" ] || missing="$missing GEMINI_API_KEY"
          [ -n "$GROQ_API_KEY" ] || missing="$missing GROQ_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (Settings > Secrets and variables > Actions)"
            exit 1
          fi

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true

      - run: uv sync --frozen --group eval

      - name: Cache embedding model
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('src/rail_rag/config.py') }}

      - name: Cache vector index
        id: index-cache
        uses: actions/cache@v6
        with:
          path: data/index
          key: index-${{ hashFiles('data/processed/**', 'src/rail_rag/chunking.py', 'src/rail_rag/embeddings.py', 'src/rail_rag/config.py') }}

      - name: Build vector index
        if: steps.index-cache.outputs.cache-hit != 'true'
        run: uv run python -m rail_rag.index

      - name: Cache judge responses
        uses: actions/cache@v6
        with:
          path: eval/.cache
          key: judge-${{ github.run_id }}
          restore-keys: judge-

      - name: Run golden set and gate
        run: >
          uv run --group eval python -m rail_rag.evaluation
          --out eval/results/ci.json
          --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-results
          path: eval/results/
          if-no-files-found: ignore
