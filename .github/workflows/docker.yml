name: docker

# Builds the production image and smoke-tests it: container starts as non-root, /health is OK,
# the UI is served, and Docker's own HEALTHCHECK reports healthy. No real API keys are used.
# On main, the tested image is pushed to GitHub Container Registry (the deploy source).
on:
  push:
    branches: [main]
    paths: [Dockerfile, .dockerignore, pyproject.toml, uv.lock, "src/**", "data/processed/**", "data/sources.yaml", .github/workflows/docker.yml]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write  # push to ghcr.io (main only)

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t rail-rag:ci .

      - name: Start container
        run: |
          docker run -d --name app -p 7860:7860 \
            -e GEMINI_API_KEY=dummy-not-used -e VECTOR_STORE=qdrant rail-rag:ci

      - name: Wait for /health
        run: |
          for i in $(seq 1 60); do
            if curl -sf localhost:7860/health; then echo; exit 0; fi
            sleep 2
          done
          docker logs app; exit 1

      - name: Check UI, non-root user and Docker healthcheck
        run: |
          curl -sf localhost:7860/ | grep -q "EU Rail Regulation Assistant"
          test "$(docker exec app id -u)" = "1000"
          for i in $(seq 1 30); do
            s=$(docker inspect -f '{{.State.Health.Status}}' app)
            echo "health: $s"; [ "$s" = healthy ] && exit 0; sleep 5
          done
          exit 1

      - name: Image size
        if: always()
        run: docker image ls rail-rag:ci --format '{{.Repository}}:{{.Tag}} {{.Size}}'

      - name: Push tested image to ghcr.io
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/rail-regulation-rag
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          tag="sha-${GITHUB_SHA::7}"
          docker tag rail-rag:ci "$IMAGE:$tag"
          docker tag rail-rag:ci "$IMAGE:latest"
          docker push "$IMAGE:$tag"
          docker push "$IMAGE:latest"
          echo "pushed $IMAGE:$tag" >> "$GITHUB_STEP_SUMMARY"
